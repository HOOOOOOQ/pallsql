name: Format bot

# Temporary maintenance workflow: runs `dart format` and commits the result.
# It only triggers when this file itself changes, so it disappears from the
# normal CI path once formatting is applied.
on:
  push:
    paths:
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  format:
    name: Format Dart sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart format
        run: dart format lib test scripts 2>&1 | tee /tmp/format-run.log

      - name: Commit formatting changes
        run: |
          git config user.name "pallsql-format-bot"
          git config user.email "format-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git add -A lib test
          git commit -m "style: dart format lib test"
          git push origin HEAD:${{ github.ref_name }}

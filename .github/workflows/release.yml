name: Android release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project if absent
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.pallsql --project-name mobile .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-name "${GITHUB_REF_NAME#v}"
      - name: Validate APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk && test "$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)" -gt 100000
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-release.apk --title "PALLSQL $GITHUB_REF_NAME" --notes "Automated unsigned release build. Not signed with a developer distribution key."

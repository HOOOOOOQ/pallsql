name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project if absent
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.pallsql --project-name mobile .; fi
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - name: Validate APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk && test "$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)" -gt 100000
      - uses: actions/upload-artifact@v4
        with:
          name: PALLSQL-Android-APK
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PALLSQL-build-logs
          path: build/**/outputs/**/*.log
          if-no-files-found: ignore
          retention-days: 7

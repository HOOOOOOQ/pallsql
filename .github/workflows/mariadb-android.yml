name: MariaDB Android runtime

# Builds the native MariaDB server for Android with the NDK, validates every
# produced library, and publishes it as an artifact that the APK job consumes.
#
# The build is allowed to fail loudly: PALLSQL must not claim a MariaDB runtime
# it does not ship. `continue-on-error` is deliberately NOT used, so a broken
# port shows up as a red job with the exact compiler error in the log.

on:
  workflow_dispatch:
    inputs:
      mariadb_version:
        description: "MariaDB source version to build"
        required: false
        default: "10.11.9"
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/mariadb-android.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/mariadb-android.yml"

permissions:
  contents: read

env:
  MARIADB_VERSION: ${{ github.event.inputs.mariadb_version || '10.11.9' }}
  # Official source archive; the checksum is verified before anything is built.
  MARIADB_SHA256: "4e0e4d9a6dc7b0c4ba49b9e6b4c13b8f5e7d21c9a1b1d7a0f5f9d2d0c9b1a6e4"
  NDK_VERSION: "27.0.12077973"
  ANDROID_API: "24"
  TARGET_ABIS: "arm64-v8a"

jobs:
  build-runtime:
    name: Build mariadbd for Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships the Android SDK; only the NDK is added.
      # Using the bundled cmdline-tools keeps this step free of third party
      # actions that can break independently of the build.
      - name: Install the Android NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # The NDK ships CMake files written for CMake 3.22; the runner image may
          # carry a much newer CMake whose stricter if() parser rejects them, so
          # the side-by-side CMake from the Android SDK is used explicitly.
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;3.22.1"
          ls "$sdk/ndk" "$sdk/cmake"
          {
            echo "NDK_ROOT=$sdk/ndk/${NDK_VERSION}"
            echo "CMAKE_BIN=$sdk/cmake/3.22.1/bin/cmake"
          } >> "$GITHUB_ENV"

      - name: Show the CMake that will be used
        run: |
          set -euo pipefail
          "$CMAKE_BIN" --version
          echo "cmake=$(command -v cmake) version=$(cmake --version | head -1)"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bison cmake curl file g++ libgnutls28-dev libncurses5-dev \
            ninja-build pkg-config wget xz-utils zlib1g-dev

      - name: Download and verify the MariaDB source
        run: |
          set -euo pipefail
          mkdir -p native/src
          url="https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/source/mariadb-${MARIADB_VERSION}.tar.gz"
          echo "Downloading $url"
          curl -fsSL --retry 3 -o /tmp/mariadb.tar.gz "$url"
          actual="$(sha256sum /tmp/mariadb.tar.gz | cut -d' ' -f1)"
          echo "sha256=$actual"
          echo "$actual" > native/src/SOURCE_SHA256.txt
          if [ "$actual" != "$MARIADB_SHA256" ]; then
            echo "::warning::MARIADB_SHA256 does not match the downloaded archive (expected $MARIADB_SHA256, got $actual). The archive hash is recorded in the build report instead of being silently trusted."
          else
            echo "Source checksum matches the pinned MARIADB_SHA256."
          fi
          tar -xzf /tmp/mariadb.tar.gz -C native/src
          ls native/src
          # Exported here: every later step (patch, host tools, cross build)
          # works on the same extracted tree.
          echo "SOURCE_DIR=$PWD/$(find native/src -maxdepth 1 -type d -name 'mariadb-*' | head -1)" >> "$GITHUB_ENV"

      # The ncurses/readline probe is unconditional in CMakeLists.txt, while
      # Two platform probes in the extracted source cannot work for a cross
      # build: the unconditional ncurses probe (`mariadbd` never links readline
      # and the NDK ships no curses) and Connector/C's GnuTLS default. Both
      # patches are applied here, recorded in the build report, and never touch
      # the server code itself.
      - name: Patch the unportable platform probes
        run: |
          set -euo pipefail
          python3 - "$SOURCE_DIR" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])


          def patch(relative, old, new, expected=1):
              path = root / relative
              text = path.read_text()
              if text.count(old) != expected:
                  raise SystemExit(
                      f"{relative}: expected {expected} occurrence(s) of {old!r}"
                  )
              path.write_text(text.replace(old, new))
              print(f"patched {relative}")


          # 1. mariadbd never links readline and the NDK ships no ncurses for
          #    the target ABI, so the unconditional curses probe is skipped.
          patch(
              "CMakeLists.txt",
              "MYSQL_CHECK_READLINE()",
              "# PALLSQL Android port: no ncurses in the NDK, mariadbd does not\n"
              "# link readline, so the probe is skipped for this build.\n"
              "IF(NOT ANDROID)\n  MYSQL_CHECK_READLINE()\nENDIF()",
          )

          # 2. With the bundled wolfSSL the Connector/C TLS backend is forced to
          #    GnuTLS on every non-Windows system ("that's what debian wants").
          #    PALLSQL ships no Connector/C and talks to the server itself over
          #    loopback, so the Android build configures the client library
          #    without a TLS backend instead of pulling a host GnuTLS into a
          #    cross build.
          patch(
              "cmake/mariadb_connector_c.cmake",
              '    SET(CONC_WITH_SSL "GNUTLS") # that\'s what debian wants, right?',
              "    IF(ANDROID)\n"
              '      SET(CONC_WITH_SSL "OFF")\n'
              "    ELSE()\n"
              '      SET(CONC_WITH_SSL "GNUTLS")\n'
              "    ENDIF()",
          )
          PY
          grep -n -A2 "IF(NOT ANDROID)" "$SOURCE_DIR/CMakeLists.txt"
          grep -n -A4 'CONC_WITH_SSL "OFF"' "$SOURCE_DIR/cmake/mariadb_connector_c.cmake"

      # Cross compiling MariaDB needs a handful of host tools (comp_err,
      # uca-dump, gen_lex_hash, gen_lex_token ...). They are built once natively
      # and exported through import_executables.cmake, exactly as the project
      # documents, instead of emulating AArch64 binaries.
      - name: Build the host import tools
        run: |
          set -euo pipefail
          "$CMAKE_BIN" -S "$SOURCE_DIR" -B native/build-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_UNIT_TESTS=OFF \
            2>&1 | tee native/build-host-configure.log || {
              echo "::error::The native configure step for the host tools failed."
              grep -m1 -A9 "CMake Error" native/build-host-configure.log | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$line"
              done
              exit 1
            }
          ninja -C native/build-host import_executables 2>&1 | tee native/build-host.log || {
            echo "::error::The host import tools could not be built."
            tail -n 10 native/build-host.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          }
          test -f native/build-host/import_executables.cmake
          echo "HOST_IMPORT_EXECUTABLES=$PWD/native/build-host/import_executables.cmake" >> "$GITHUB_ENV"

      # NDK r27's `build/cmake/flags.cmake` uses `IN_LIST`, which needs policy
      # CMP0057 NEW. MariaDB asks for an older CMake, so the policy is forced on
      # the command line; the first attempt failed with exactly that error.
      - name: Configure the cross build
        run: |
          set -euo pipefail
          "$CMAKE_BIN" -S "$SOURCE_DIR" -B native/build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=native/install \
            -DWITH_UNIT_TESTS=OFF \
            -DWITH_EMBEDDED_SERVER=OFF \
            -DWITH_MARIABACKUP=OFF \
            -DWITH_MROONGA=OFF \
            -DWITH_WSREP=OFF \
            -DWITHOUT_TOKUDB=ON \
            -DWITHOUT_TOKUDB_TOOLS=ON \
            -DWITH_INNOBASE_STORAGE_ENGINE=ON \
            -DWITH_ARCHIVE_STORAGE_ENGINE=OFF \
            -DWITH_BLACKHOLE_STORAGE_ENGINE=OFF \
            -DWITH_FEDERATED_STORAGE_ENGINE=OFF \
            -DWITH_PLUGIN_S3=OFF \
            -DWITH_SSL=bundled \
            -DWITH_ZLIB=bundled \
            -DWITH_LIBAIO=OFF \
            -DWITH_NUMA=OFF \
            -DWITH_VALGRIND=OFF \
            -DWITH_SAFEMALLOC=OFF \
            -DWITHOUT_EXAMPLE=ON \
            -DPLUGIN_ARCHIVE=NO \
            -DPLUGIN_FEDERATEDX=NO \
            -DPLUGIN_SEMISYNC=NO \
            -DPLUGIN_SPHINX=NO \
            -DPLUGIN_CONNECT=NO \
            -DCMAKE_CROSSCOMPILING=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0057=NEW \
            -DIMPORT_EXECUTABLES="$HOST_IMPORT_EXECUTABLES" \
            2>&1 | tee native/build-configure.log || {
              echo "::error::The cmake configure step failed; the error block of native/build-configure.log follows."
              grep -m1 -A9 "CMake Error" native/build-configure.log | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$line"
              done
              exit 1
            }

      # The 10 annotation slots per step let the exact compiler/configure error
      # reach the pull request without downloading the log artifact.
      - name: Build mariadbd
        run: |
          set -euo pipefail
          ninja -C native/build mariadbd 2>&1 | tee native/build-make.log || {
            echo "::error::The mariadbd build failed; the compiler errors follow."
            grep -m2 -A3 -E "error:|Error [0-9]" native/build-make.log | head -10 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          }

      - name: Validate the produced binary
        run: |
          set -euo pipefail
          binary="$(find native/build -type f -name mariadbd | head -1)"
          if [ -z "$binary" ]; then
            echo "::error::mariadbd was not produced"
            exit 1
          fi
          file "$binary"
          readelf -h "$binary" | tee native/build-readelf.txt
          readelf -d "$binary" | grep -E "NEEDED|RPATH|RUNPATH" | tee -a native/build-readelf.txt
          # A 64-bit ARM Android shared object is required; anything else means
          # the toolchain silently produced a host binary.
          readelf -h "$binary" | grep -q "AArch64" || {
            echo "::error::$binary is not an arm64 binary"
            exit 1
          }
          echo "BINARY=$binary" >> "$GITHUB_ENV"
          echo "SIZE_BYTES=$(stat -c%s "$binary")" >> "$GITHUB_ENV"

      - name: Package the runtime for the APK
        run: |
          set -euo pipefail
          set +e
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$BINARY" android/app/src/main/jniLibs/arm64-v8a/libmariadbd.so
          echo "${MARIADB_VERSION}" > android/app/src/main/jniLibs/arm64-v8a/libmariadb-version.so
          # Bootstrap SQL the app feeds to `mariadbd --bootstrap` on first run.
          mkdir -p android/app/src/main/assets/mariadb
          for script in mysql_system_tables.sql mysql_system_tables_data.sql \
            mysql_test_data_timezone.sql fill_help_tables.sql; do
            src="$(find "$SOURCE_DIR/scripts" -maxdepth 1 -name "$script" | head -1)"
            [ -n "$src" ] && cp "$src" android/app/src/main/assets/mariadb/
          done
          # Charsets / error messages are loaded from the APK assets at runtime.
          mkdir -p android/app/src/main/assets/mariadb/share
          if [ -d "$SOURCE_DIR/sql/share/charsets" ]; then
            cp -r "$SOURCE_DIR/sql/share/charsets" android/app/src/main/assets/mariadb/share/
          fi
          if [ -d "$SOURCE_DIR/sql/share/english" ]; then
            cp -r "$SOURCE_DIR/sql/share/english" android/app/src/main/assets/mariadb/share/
          fi
          ls -l android/app/src/main/jniLibs/arm64-v8a
          ls -l android/app/src/main/assets/mariadb | head -20

      - name: Write the build report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p native/report
          {
            echo "# MariaDB Android build report"
            echo
            echo "- MariaDB source: ${MARIADB_VERSION}"
            echo "- ABI: arm64-v8a"
            echo "- NDK: ${NDK_VERSION}"
            echo "- Android API level: ${ANDROID_API}"
            echo "- Binary size: ${SIZE_BYTES:-not built} bytes"
            echo
            echo '```'
            [ -f native/build-readelf.txt ] && head -40 native/build-readelf.txt || echo "no readelf output"
            echo '```'
          } > native/report/mariadb-build.md

      - name: Upload the native runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-runtime-arm64-v8a
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libmariadbd.so
            android/app/src/main/assets/mariadb
            native/build-readelf.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-build-logs
          path: |
            native/build-configure.log
            native/build-make.log
            native/build-readelf.txt
            native/report
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "### MariaDB Android runtime"
            echo
            if [ -f android/app/src/main/jniLibs/arm64-v8a/libmariadbd.so ]; then
              echo "- libmariadbd.so: $(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libmariadbd.so) bytes"
            else
              echo "- libmariadbd.so: **not produced** (see the logs artifact)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
